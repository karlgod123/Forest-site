<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Учебный проект о создании атмосферной 3D-сцены с помощью HTML, CSS и JavaScript.">
    <link rel="stylesheet" href="main.css">
    <script src="app.js" defer></script>
    <script src="./libs/rain.js" defer></script>
    <title>Forest Lab — 3D-параллакс</title>
</head>
<body>
    <a class="logo" href="./index.html" style="background-image: url(img/logo.svg);" aria-label="Forest Lab — главная"></a>

    <section class="layers">
        <div class="layers__container">
            <div class="layers__item layer-1" style="background-image: url(img/layer-1.jpg);"></div>
            <div class="layers__item layer-2" style="background-image: url(img/layer-2.png);"></div>
            <div class="layers__item layer-3">
                <div class="hero-content">
                    <h1>Forest Lab <span>3D-параллакс</span></h1>
                    <p class="hero-content__p">Учебный проект о слоях, движении и атмосферных эффектах</p>
                    <a class="button-start" href="./site.html">Изучить проект</a>
                </div>
            </div>
            <div class="layers__item layer-4">
                <canvas class="rain"></canvas>
            </div>
            <div class="layers__item layer-5" style="background-image: url(img/layer-5.png);"></div>
            <div class="layers__item layer-6" style="background-image: url(img/layer-6.png);"></div>
        </div>
    </section>
</body>
</html>
